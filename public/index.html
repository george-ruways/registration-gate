<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(92vw, 560px);
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 28px;
    }
    p {
      line-height: 1.6;
      margin: 10px 0;
    }
    .time {
      font-weight: 700;
    }
    .countdown {
      font-size: 22px;
      font-weight: 700;
      margin: 18px 0;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: white;
      width: 100%;
      max-width: 320px;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Event Registration</h1>
    <p>The registration link opens at:</p>
    <p class="time">21 April 2026, 11:00 PM (Cairo time)</p>

    <div class="countdown" id="countdown">Checking time...</div>

    <button id="goBtn" disabled>Open registration</button>

    <p class="small">
      If you opened this page before the opening time, keep it open.
      The button will unlock automatically.
    </p>
  </div>

  <script>
    const OPEN_YEAR = 2026;
    const OPEN_MONTH = 4;
    const OPEN_DAY = 21;
    const OPEN_HOUR = 23;
    const OPEN_MINUTE = 0;

    const countdownEl = document.getElementById("countdown");
    const goBtn = document.getElementById("goBtn");

    function cairoParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);

      const map = {};
      for (const p of parts) {
        if (p.type !== "literal") map[p.type] = p.value;
      }
      return {
        year: Number(map.year),
        month: Number(map.month),
        day: Number(map.day),
        hour: Number(map.hour),
        minute: Number(map.minute),
        second: Number(map.second)
      };
    }

    function keyFromParts(p) {
      const pad = n => String(n).padStart(2, "0");
      return `${p.year}${pad(p.month)}${pad(p.day)}${pad(p.hour)}${pad(p.minute)}`;
    }

    const openKey =
      `${OPEN_YEAR}${String(OPEN_MONTH).padStart(2,"0")}${String(OPEN_DAY).padStart(2,"0")}${String(OPEN_HOUR).padStart(2,"0")}${String(OPEN_MINUTE).padStart(2,"0")}`;

    function remainingText() {
      const nowUTCGuess = Date.now();
      const fakeTarget = new Date(
        Date.UTC(OPEN_YEAR, OPEN_MONTH - 1, OPEN_DAY, OPEN_HOUR - 2, OPEN_MINUTE, 0)
      );

      let diff = fakeTarget.getTime() - nowUTCGuess;
      if (diff <= 0) return "Registration is open";

      const totalSec = Math.floor(diff / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${h}h ${m}m ${s}s`;
    }

    function tick() {
      const now = cairoParts();
      const nowKey = keyFromParts(now);
      const open = nowKey >= openKey;

      if (open) {
        countdownEl.textContent = "Registration is open";
        goBtn.disabled = false;
      } else {
        countdownEl.textContent = remainingText();
        goBtn.disabled = true;
      }
    }

    goBtn.addEventListener("click", () => {
      window.location.href = "/go";
    });

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
