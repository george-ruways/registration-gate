<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THY Camps - Social Media</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #f7fafc 0%, #eef2f7 100%);
      color: #1f2937;
    }

    .card {
      width: min(92vw, 560px);
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      border: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 38px);
    }

    p {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.6;
      color: #4b5563;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    a {
      display: inline-block;
      text-decoration: none;
      color: #111827;
      font-weight: 700;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
    }

    a:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>THY Camps</h1>
    <p>Follow us on social media: @thycamps</p>
    <div class="links">
      <a href="https://www.facebook.com/thycamps" target="_blank" rel="noopener noreferrer">Facebook @thycamps</a>
      <a href="https://www.instagram.com/thycamps" target="_blank" rel="noopener noreferrer">Instagram @thycamps</a>
    </div>
  </main>
</body>
</html>
