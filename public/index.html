<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <title>THY Camps | Social</title>
  <style>
    :root {
      --bg-a: #fff7ed;
      --bg-b: #ecfeff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --panel: rgba(255, 255, 255, 0.84);
      --line: rgba(15, 23, 42, 0.1);
      --fb: #1877f2;
      --ig-a: #f58529;
      --ig-b: #dd2a7b;
      --ig-c: #8134af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Outfit", "Plus Jakarta Sans", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text-main);
      background:
        radial-gradient(1200px 800px at 8% -20%, #fb923c40, transparent 60%),
        radial-gradient(1000px 700px at 92% 0%, #06b6d433, transparent 58%),
        linear-gradient(145deg, var(--bg-a) 0%, var(--bg-b) 100%);
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 38vmax;
      height: 38vmax;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(6px);
      animation: float 10s ease-in-out infinite;
    }

    body::before {
      left: -12vmax;
      bottom: -14vmax;
      background: radial-gradient(circle at 30% 30%, #fb923c44 0%, #fb923c14 60%, transparent 76%);
    }

    body::after {
      right: -14vmax;
      top: -18vmax;
      background: radial-gradient(circle at 60% 40%, #06b6d444 0%, #06b6d417 60%, transparent 76%);
      animation-delay: -4s;
    }

    .card {
      width: min(96vw, 680px);
      position: relative;
      z-index: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 55px rgba(15, 23, 42, 0.14);
      padding: clamp(22px, 5vw, 38px);
      text-align: center;
      animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo {
      width: clamp(86px, 20vw, 118px);
      height: auto;
      display: block;
      margin: 0 auto 14px;
      animation: pulse 2.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: clamp(30px, 8vw, 54px);
      line-height: 1.05;
      animation: rise 0.8s 0.07s both;
    }

    .subtitle {
      margin: 12px auto 0;
      max-width: 46ch;
      color: var(--text-muted);
      font-size: clamp(16px, 3.5vw, 20px);
      line-height: 1.45;
      animation: rise 0.8s 0.14s both;
    }

    .handle {
      margin: 14px 0 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 700;
      font-size: clamp(17px, 4vw, 22px);
      color: #0f766e;
      animation: rise 0.8s 0.22s both;
    }

    .links {
      display: grid;
      gap: 13px;
      margin-top: 22px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 58px;
      transform: translateY(12px);
      opacity: 0;
      animation: rise 0.7s 0.3s both;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .link svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    .link:hover {
      transform: translateY(-2px);
      filter: saturate(1.1) brightness(1.05);
    }

    .facebook {
      background: linear-gradient(90deg, #1663cb 0%, var(--fb) 100%);
      box-shadow: 0 10px 20px #1877f24f;
      animation-delay: 0.32s;
    }

    .instagram {
      background: linear-gradient(90deg, var(--ig-a) 0%, var(--ig-b) 50%, var(--ig-c) 100%);
      box-shadow: 0 10px 20px #dd2a7b42;
      animation-delay: 0.4s;
    }

    .footer {
      margin-top: 17px;
      color: var(--text-muted);
      font-size: 14px;
      animation: rise 0.8s 0.5s both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-16px);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    @media (max-width: 420px) {
      .card {
        border-radius: 22px;
        padding: 20px 16px 22px;
      }

      .link {
        min-height: 54px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/thy-logo.png" alt="THY Camps logo" />
    <h1>THY Camps</h1>
    <p class="subtitle">Stay connected with us for announcements, events, and updates from the service.</p>
    <p class="handle">@thycamps</p>
    <div class="links">
      <a class="link facebook" href="https://www.facebook.com/thycamps" data-app="fb://facewebmodal/f?href=https://www.facebook.com/thycamps" data-web="https://www.facebook.com/thycamps" aria-label="Open THY Camps on Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.54-4.7 1.32 0 2.7.24 2.7.24v2.97h-1.52c-1.49 0-1.96.94-1.96 1.9v2.28h3.34l-.53 3.49h-2.81V24C19.61 23.08 24 18.09 24 12.07z" />
        </svg>
        Facebook @thycamps
      </a>
      <a class="link instagram" href="https://www.instagram.com/thycamps" data-app="instagram://user?username=thycamps" data-web="https://www.instagram.com/thycamps" aria-label="Open THY Camps on Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.8A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95h-8.5zm8.97 1.35a1.08 1.08 0 1 1 0 2.16 1.08 1.08 0 0 1 0-2.16zM12 7.2a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6zm0 1.8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
        </svg>
        Instagram @thycamps
      </a>
    </div>
    <p class="footer">Official social channels</p>
  </main>
  <script>
    // Try opening native apps on mobile; if unavailable, fall back to the web URL.
    function setupSocialLink(link) {
      link.addEventListener("click", function (event) {
        const appUrl = link.getAttribute("data-app");
        const webUrl = link.getAttribute("data-web") || link.href;

        if (!appUrl) {
          return;
        }

        event.preventDefault();

        let didHide = false;
        const onVisibilityChange = function () {
          if (document.hidden) {
            didHide = true;
          }
        };

        document.addEventListener("visibilitychange", onVisibilityChange, { once: true });
        window.location.href = appUrl;

        setTimeout(function () {
          if (!didHide) {
            window.location.href = webUrl;
          }
        }, 900);
      });
    }

    document.querySelectorAll("a.link[data-app]").forEach(setupSocialLink);
  </script>
</body>
</html>
